{{define "begin"}}<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · 门户代理 POC</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{{end}}

{{define "topnav"}}<nav class="nav">
  <a class="brand" href="/">WeKnora 门户</a>
  {{if .User}}<a href="/">知识库</a>
  <a href="/chat">问答</a>
  {{if .User.IsAdmin}}<a href="/admin">管理后台</a>{{end}}
  <span class="spacer"></span>
  <span class="who">{{.User.DisplayName}}（{{.User.UUMUserID}}）{{if .User.IsAdmin}} · 管理员{{end}}</span>
  <form method="post" action="/logout" class="inline"><button class="link">退出</button></form>
  {{else}}<span class="spacer"></span><span class="who">未登录</span>{{end}}
</nav>{{end}}

{{define "end"}}<footer class="foot">B1 路线 POC · 门户代理 · WeKnora 零改动</footer>
<script src="/static/app.js"></script>
</body>
</html>{{end}}
